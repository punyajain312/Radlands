name: Keep Render Alive

on:
  schedule:
    # Ping every 10 minutes. Render free tier sleeps after 15 min of inactivity.
    - cron: '*/10 * * * *'
  workflow_dispatch:   # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set — skipping ping"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 --connect-timeout 10 \
            "${URL}/health" 2>/dev/null) || STATUS="curl_error"
          echo "Response status: $STATUS"
          if [ "$STATUS" = "curl_error" ]; then
            echo "Warning: curl failed (backend may be starting up)"
          elif [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
          else
            echo "Backend is alive"
          fi
